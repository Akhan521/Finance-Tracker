name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Match key values, not the bare prefix: supabase-js itself contains
      # the string `sb_secret_` (it refuses secret keys in the browser).
      - name: Check the bundle for secrets
        run: "! grep -rE 'sb_secret_[A-Za-z0-9_-]{16,}|service_role|SMTP_|GMAIL' dist"
      # The edge runtime reads functions/.env only when it starts, so copy it first.
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - run: npx supabase start -x studio,imgproxy,vector,logflare
      - run: npx supabase db reset
      - run: npm run test:db
